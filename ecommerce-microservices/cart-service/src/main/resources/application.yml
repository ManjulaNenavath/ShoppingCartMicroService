server:
  # Locally this is 8083. On Render/Railway the platform injects PORT and we bind to it.
  port: ${PORT:8083}

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:h2:mem:cartsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
