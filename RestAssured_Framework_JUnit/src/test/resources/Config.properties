# Base URLs per microservice. Because these are independent services they each
# listen on their own port. When you deploy to Render/Railway, replace these with
# the public HTTPS URLs (see README "Pointing tests at a hosted environment").
user.baseUrl=http://localhost:8081
product.baseUrl=http://localhost:8082
cart.baseUrl=http://localhost:8083

# A convenience default (used if a test does not pick a specific service).
baseUrl=http://localhost:8081

# Seeded / known test values
default.userId=1
