# JUnit 5 parallel execution config (the equivalent of TestNG's parallel="tests").
#
# classes.default = concurrent  -> different test CLASSES run on separate threads
# mode.default    = same_thread -> methods WITHIN a class stay on one thread, so the
#                                  @Order-ed lifecycle (register -> ... -> delete) is safe.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
