# ============================================================================
#  ENVIRONMENT SWITCH
#  Only ONE block should be active (uncommented) at a time.
#  A -D override on the command line always wins over whatever is set here, e.g.
#     mvn test -Duser.baseUrl=https://user-service-xxxx.onrender.com
# ============================================================================

# ---- LOCAL (services started via docker-compose or java -jar) ----
